name: test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Verify package contents
        run: bun run verify:package

  # F-12/F-13: supported-pi compatibility matrix. The peerDependencies are
  # wildcard, so the extension must keep passing against both the oldest
  # supported and the latest published pi packages. The version matrix here is
  # the automated evidence for the documented support policy in README.md.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["0.84.0", "0.84.1"] # oldest supported / latest published
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin pi packages to ${{ matrix.pi-version }}
        run: |
          bun add -d \
            @earendil-works/pi-ai@${{ matrix.pi-version }} \
            @earendil-works/pi-coding-agent@${{ matrix.pi-version }} \
            @earendil-works/pi-tui@${{ matrix.pi-version }}

      - name: Typecheck against pi ${{ matrix.pi-version }}
        run: bun run typecheck

      - name: Run unit tests against pi ${{ matrix.pi-version }}
        run: bun test

  # OMP dual-compatibility: the extension must typecheck against the pinned
  # OMP 17.2.12 API surface (@oh-my-pi/* dev-only test deps, never in
  # peerDependencies or runtime imports), pass the full unit suite including
  # the OMP-shaped controller fixtures, and be loadable by an isolated OMP
  # profile with a clean `omp plugin doctor`. The `omp` binary comes from the
  # pinned @oh-my-pi/pi-coding-agent dev dependency.
  omp-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck against OMP API types (17.2.12)
        run: bun run typecheck:omp

      - name: Run unit suite (Pi + OMP-shaped fixtures)
        run: bun test

      - name: Verify package contents
        run: bun run verify:package

      - name: Pack the extension artifact
        run: |
          mkdir -p /tmp/np-pack
          npm pack --pack-destination /tmp/np-pack

      - name: Install into an isolated OMP profile
        run: |
          mkdir -p /tmp/np-extracted
          tar -xzf /tmp/np-pack/gamaraan-next-prompt-*.tgz -C /tmp/np-extracted
          OMP_PROFILE=next-prompt-ci ./node_modules/.bin/omp plugin install /tmp/np-extracted/package

      - name: Require zero plugin errors via omp plugin doctor
        run: |
          OMP_PROFILE=next-prompt-ci ./node_modules/.bin/omp plugin doctor --json > /tmp/doctor.json
          cat /tmp/doctor.json
          errors=$(jq '[.[] | select(.status == "error")] | length' /tmp/doctor.json)
          if [ "$errors" -ne 0 ]; then
            echo "omp plugin doctor reported $errors error(s)"; exit 1
          fi
